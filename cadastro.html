<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadastro — Organização Solidária</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<div class="container">
<a href="index.html" class="brand"><img src="Logo da Organização.jpg" alt="Logo" width="100"></a>
<nav aria-label="Navegação principal">
<ul>
<li><a href="index.html">Início</a></li>
<li><a href="projetos.html">Projetos</a></li>
<li><a href="cadastro.html">Cadastro</a></li>
</ul>
</nav>
</div>
</header>


<main class="container">
<h1>Cadastro de voluntário</h1>
<form id="cadastroForm" action="#" method="post" novalidate>
<fieldset>
<legend>Dados pessoais</legend>


<label for="nome">Nome completo</label>
<input type="text" id="nome" name="nome" required minlength="3">


<label for="email">E‑mail</label>
<input type="email" id="email" name="email" required>


<label for="cpf">CPF</label>
<input type="text" id="cpf" name="cpf" inputmode="numeric" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" required placeholder="000.000.000-00">


<label for="telefone">Telefone</label>
<input type="tel" id="telefone" name="telefone" inputmode="tel" pattern="\(\d{2}\) \d{4,5}-\d{4}" required placeholder="(00) 90000-0000">


<label for="nascimento">Data de nascimento</label>
<input type="date" id="nascimento" name="nascimento" required>
</fieldset>


<fieldset>
<legend>Endereço</legend>


<label for="endereco">Endereço</label>
<input type="text" id="endereco" name="endereco" required>


<label for="cep">CEP</label>
<input type="text" id="cep" name="cep" inputmode="numeric" pattern="\d{5}-\d{3}" required placeholder="00000-000">


<label for="cidade">Cidade</label>
<input type="text" id="cidade" name="cidade" required>


<label for="estado">Estado</label>
<select id="estado" name="estado" required>
<option value="">Escolha...</option>
<option value="SP">SP</option>
<option value="RJ">RJ</option>
<option value="MG">MG</option>
<!-- incluir todos os estados conforme necessário -->
</select>
</fieldset>


<button type="submit">Enviar cadastro</button>
</form>


<script src="js/masks.js"></script>
</main>


<footer>
<div class="container">
<p>&copy; <span id="year3"></span> Organização Solidária</p>
</div>
<script>document.getElementById('year3').textContent = new Date().getFullYear();</script>
</footer>
</body>
</html>
